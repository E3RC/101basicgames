<body>
  <div id="app" class="app">
    <header class="site-header">

          <rect x="2" y="4" width="28" height="24" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>

          <circle cx="16" cy="12" r="2" fill="currentColor"/>
          <circle cx="22" cy="12" r="2" fill="currentColor"/>
          <path d="M8 20h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M8 24h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">101 BASIC</span>

      <nav class="site-nav" role="navigation" aria-label="Main navigation">
        <a href="#/" class="nav-link">Home</a>
        <a href="#/catalog" class="nav-link">Games</a>

          </svg>

      <p>Based on <em>101 BASIC Computer Games</em> by David H. Ahl (1975). Historical reference and playable recreations. <a href="#/about">Learn more</a>.</p>
    </footer>
  </div>

  <script src="js/utils/rng.js"></script>
